<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarePoint — Interactive Demo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#183c3e;background:#f3f8f7}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#103e40;color:white;padding:25px 16px}aside h2{margin:4px 10px 35px;font-size:24px}aside button{display:block;width:100%;text-align:left;padding:13px;border-radius:9px;background:transparent;color:#d4eded;margin-bottom:5px}aside button.active,aside button:hover{background:#24615f;color:#fff}main{padding:32px;max-width:1300px;width:100%;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px}header small{color:#5b7777}h1{margin:8px 0 5px;font-size:29px}p{color:#637878}.badge{display:inline-block;border-radius:20px;padding:7px 12px;background:#d4eeea;color:#136c61;font-weight:700;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:26px 0}.stat,.panel{background:white;border:1px solid #e0eeea;border-radius:14px;box-shadow:0 3px 15px #0a58500a}.stat{padding:22px}.stat strong{font-size:29px;display:block;margin:7px 0}.stat span{color:#66807c;font-size:13px}.panel{padding:22px;margin:20px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.primary{background:#137a71;color:#fff;border-radius:9px;padding:10px 15px}.danger{background:#fce9e9;color:#ad3535;border-radius:8px;padding:8px}.outline{background:white;border:1px solid #c1dcda;border-radius:8px;padding:8px;color:#15675f}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,form input,form select{padding:11px 12px;border-radius:8px;border:1px solid #bfd9d5;min-width:170px;max-width:100%;background:white}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:13px 9px;border-bottom:1px solid #edf3f1;font-size:14px}th{color:#66807c;font-size:12px;text-transform:uppercase}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}form label{display:flex;flex-direction:column;gap:5px;font-size:13px}form button{align-self:end}.muted{color:#69817d}.status{padding:5px 8px;border-radius:20px;background:#e2f4ed;color:#097b60;font-size:12px}.note{font-size:13px;margin:16px 0;padding:13px;border:1px solid #baded8;border-radius:10px;background:#e9f8f5}.empty{text-align:center;padding:25px;color:#789}.actions{display:flex;gap:7px}.mobile{display:none}@media(max-width:800px){.shell{display:block}aside{padding:13px}aside h2{margin:0 0 10px}nav{display:flex;overflow:auto}aside button{white-space:nowrap;width:auto}main{padding:17px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:13px}table{display:block;overflow-x:auto}form{grid-template-columns:1fr}h1{font-size:23px}}@media(max-width:400px){.stats{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside><h2>✚ CarePoint</h2><nav id="nav"></nav></aside><main><header><div><small>Healthcare management platform</small><h1 id="page-title">Overview</h1></div><span class="badge">INTERACTIVE DEMO</span></header><div class="note">This is a portfolio demo with fictional, non-medical sample data. No real patients, authentication, backend or database. Changes stay in your browser only.</div><div id="view"></div></main></div><script>
const seed={patients:[{id:1,name:'Jordan Lee',email:'jordan@example.test',age:31},{id:2,name:'Sam Taylor',email:'sam@example.test',age:27},{id:3,name:'Alex Morgan',email:'alex@example.test',age:42}],appointments:[{id:1,patient:'Jordan Lee',doctor:'Dr. Smith',date:'2026-11-03',status:'Confirmed'},{id:2,patient:'Sam Taylor',doctor:'Dr. Rana',date:'2026-11-05',status:'Pending'},{id:3,patient:'Alex Morgan',doctor:'Dr. Smith',date:'2026-11-07',status:'Confirmed'}],doctors:[{id:1,name:'Dr. Smith',specialty:'Cardiology',status:'Approved'},{id:2,name:'Dr. Rana',specialty:'Dermatology',status:'Pending'},{id:3,name:'Dr. Noor',specialty:'Family Medicine',status:'Approved'}]};
const key='carepoint_demo_v1';let data;try{data=JSON.parse(localStorage.getItem(key))||structuredClone(seed)}catch{data=structuredClone(seed)}let section='Overview',search='',editing=null;const sections=['Overview','Patients','Appointments','Doctors'];const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(data));const rows=s=>data[s.toLowerCase()];const id=()=>Date.now();function nav(){section='Overview';render()}function setSection(s){section=s;search='';editing=null;render()}function reset(){if(confirm('Restore original demo data?')){data=structuredClone(seed);save();render()}}function erase(s,i){data[s]=data[s].filter(x=>x.id!==i);save();render()}function edit(s,i){editing={section:s,id:i};render()}function formSubmit(event,s){event.preventDefault();const obj=Object.fromEntries(new FormData(event.target).entries());if(s==='patients')obj.age=Number(obj.age);if(editing){data[s]=data[s].map(x=>x.id===editing.id?{...x,...obj}:x)}else data[s].unshift({...obj,id:id()});editing=null;save();render()}function render(){ $('nav').innerHTML=sections.map(s=>'<button class="'+(s===section?'active':'')+'" data-section="'+s+'">'+({Overview:'▦',Patients:'♧',Appointments:'◷',Doctors:'✚'}[s])+' '+s+'</button>').join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>setSection(b.dataset.section));$('page-title').textContent=section;let h='';if(section==='Overview'){const counts=[['Patients',data.patients.length],['Appointments',data.appointments.length],['Approved doctors',data.doctors.filter(x=>x.status==='Approved').length],['Pending approvals',data.doctors.filter(x=>x.status==='Pending').length]];h='<div class="stats">'+counts.map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong><span>Demo data</span></div>').join('')+'</div><div class="panel"><div class="bar"><h2>Upcoming appointments</h2><button class="outline" data-to="Appointments">View all →</button></div>'+table('appointments',data.appointments.slice(0,5))+'</div><div class="panel"><h2>Try the portal</h2><p>Manage fictional patient records, create and edit appointments, and review doctor statuses. Every action is local to this device.</p></div>'}else{let s=section.toLowerCase(),arr=rows(section).filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(search.toLowerCase())));h='<div class="panel"><div class="bar"><h2>'+section+' <span class="muted">('+rows(section).length+')</span></h2><button class="primary" id="add">+ Add '+section.slice(0,-1)+'</button></div><div class="toolbar"><input aria-label="Search" id="search" placeholder="Search '+s+'..." value="'+safe(search)+'"><button class="outline" id="reset">Reset demo data</button></div>'+table(s,arr)+'</div><div id="editor"></div>';}$('view').innerHTML=h;document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>setSection(b.dataset.to));if(section!=='Overview'){$('add').onclick=()=>{editing={section:section.toLowerCase(),id:null};drawEditor()};$('search').oninput=e=>{search=e.target.value;render();$('search').focus();$('search').setSelectionRange(search.length,search.length)};$('reset').onclick=reset;if(editing)drawEditor()}document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.s,Number(b.dataset.edit)));document.querySelectorAll('[data-erase]').forEach(b=>b.onclick=()=>erase(b.dataset.s,Number(b.dataset.erase)))}function table(s,arr){const cols={patients:['name','email','age'],appointments:['patient','doctor','date','status'],doctors:['name','specialty','status']}[s];return arr.length?'<table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+arr.map(x=>'<tr>'+cols.map(c=>'<td>'+(c==='status'?'<span class="status">'+safe(x[c])+'</span>':safe(x[c]))+'</td>').join('')+'<td><div class="actions"><button class="outline" data-edit="'+x.id+'" data-s="'+s+'">Edit</button><button class="danger" data-erase="'+x.id+'" data-s="'+s+'">Delete</button></div></td></tr>').join('')+'</tbody></table>':'<div class="empty">No records found.</div>'}function drawEditor(){const s=editing.section,x=rows(s).find(a=>a.id===editing.id)||{},fields={patients:[['name','Name','text'],['email','Email','email'],['age','Age','number']],appointments:[['patient','Patient','text'],['doctor','Doctor','text'],['date','Date','date'],['status','Status','select:Pending,Confirmed,Cancelled']],doctors:[['name','Doctor','text'],['specialty','Specialty','text'],['status','Status','select:Pending,Approved,Rejected']]}[s];$('editor').innerHTML='<div class="panel"><div class="bar"><h2>'+(editing.id?'Edit':'Add')+' '+s.slice(0,-1)+'</h2><button class="outline" id="cancel">Close</button></div><form id="record-form">'+fields.map(([key,label,type])=>'<label>'+label+(type.startsWith('select:')?'<select required name="'+key+'">'+type.slice(7).split(',').map(o=>'<option '+(x[key]===o?'selected':'')+'>'+safe(o)+'</option>').join('')+'</select>':'<input required name="'+key+'" type="'+type+'" value="'+safe(x[key]||'')+'">')+'</label>').join('')+'<button class="primary">Save record</button></form></div>';$('cancel').onclick=()=>{editing=null;render()};$('record-form').onsubmit=e=>formSubmit(e,s);$('editor').scrollIntoView({behavior:'smooth',block:'nearest'})}render();
</script></body></html>
