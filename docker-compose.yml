services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: carepoint-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: CarePoint.API/Dockerfile
    container_name: carepoint-api
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CarePointDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;
      - JwtSettings__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JwtSettings__Issuer=CarePoint
      - JwtSettings__Audience=CarePointApp
      - SeedDemoData=${SEED_DEMO_DATA:-false}
      - DemoSeedPassword=${DEMO_SEED_PASSWORD:-}
      - EmailSettings__FromAddress=${EMAIL_FROM_ADDRESS:-}
      - EmailSettings__FromName=${EMAIL_FROM_NAME:-CarePoint}
      - EmailSettings__SmtpHost=${SMTP_HOST:-}
      - EmailSettings__SmtpPort=${SMTP_PORT:-587}
      - EmailSettings__SmtpUser=${SMTP_USER:-}
      - EmailSettings__SmtpPassword=${SMTP_PASSWORD:-}
      - EmailSettings__UseSsl=${SMTP_USE_SSL:-true}
      - EmailSettings__PasswordResetUrl=${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      - ClinicTime__TimeZoneId=${CLINIC_TIME_ZONE:-Asia/Amman}
      - Database__InitializeOnStartup=${INITIALIZE_DATABASE_ON_STARTUP:-true}
    volumes:
      - medical-documents:/app/App_Data/medical-documents

  frontend:
    build:
      context: ./frontend
    container_name: carepoint-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - VITE_API_PROXY_TARGET=http://api:8080
      - VITE_CLINIC_TIME_ZONE=${CLINIC_TIME_ZONE:-Asia/Amman}

volumes:
  sqlserver-data:
  medical-documents:
